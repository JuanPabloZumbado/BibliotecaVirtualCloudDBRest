spring.application.name=BibliotecaVirtual

# Los scripts schema.sql y data.sql se ejecutan en cada arranque.
# Son idempotentes (CREATE TABLE IF NOT EXISTS / INSERT IGNORE).
spring.sql.init.mode=always
spring.sql.init.platform=mysql
spring.sql.init.encoding=UTF-8

# Credenciales por variables de entorno (no se versionan): DB_USR_NAME y DB_PWD.
# DB_PORT es opcional (por defecto 3306).
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/bibliotecadb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Costa_Rica&characterEncoding=UTF-8
spring.datasource.username=${DB_USR_NAME}
spring.datasource.password=${DB_PWD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
